[package]
name = "project-hangar"
version = "0.1.0"
description = "Project Hangar - lokalni sifrovany spravce projektu"
authors = ["Helion CZ"]
edition = "2021"

[lib]
name = "project_hangar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Sifrovana SQLite (SQLCipher) - kompiluje se staticky, zadne systemove zavislosti
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["clock"] }
thiserror = "1"
# Lokalni HTTP server pro live preview webu + ZIP export slozky (web builder)
tiny_http = "0.12"
zip = { version = "2", default-features = false, features = ["deflate"] }
walkdir = "2"
# HTTP klient: AI proxy (web builder) + Supabase cloud sync
ureq = { version = "2", features = ["json"] }
# Monitoring webu: HTTPS dostupnost + cteni expirace SSL certifikatu (cisty Rust)
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
x509-parser = "0.16"
# Cloud sync (Supabase): E2E sifrovani snapshotu trezoru
aes-gcm = "0.10"
# Website Import & Redesign: parsovani HTML + skladani URL assetu
scraper = "0.20"
url = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
